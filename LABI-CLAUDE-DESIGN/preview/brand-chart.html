<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Chart tokens</title></head>
<body><div class="card">
  <div style="background:#fff; border:1px solid #E3EBF6; border-radius:16px; padding:14px 16px 10px; box-shadow:0 1px 3px rgba(18,38,63,.05);">

    <!-- Title row + inline legend -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <div style="font-size:13px; font-weight:600; color:#12263F;">Proteine C Réactive <span style="color:#95AAC9; font-weight:500;">· mg/L</span></div>
      <div style="display:inline-flex; align-items:center; gap:14px;">
        <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#5A7184;">
          <span style="width:14px; height:2px; background:#4484B2; border-radius:2px;"></span>Mesure
        </span>
        <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#5A7184;">
          <span style="width:14px; height:8px; background:rgba(0,200,0,.20); border-radius:3px;"></span>Plage normale
        </span>
        <span style="display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#5A7184;">
          <span style="width:8px; height:8px; background:#E5363F; border-radius:50%;"></span>Hors plage
        </span>
      </div>
    </div>

    <svg width="100%" height="180" viewBox="0 0 640 180" preserveAspectRatio="none" style="display:block;">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#00C800" stop-opacity=".22"/>
          <stop offset="1" stop-color="#00C800" stop-opacity=".04"/>
        </linearGradient>
        <!-- horizontal feather mask so the band fades at left/right edges -->
        <linearGradient id="mask-h" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
          <stop offset="0.08" stop-color="#fff" stop-opacity="1"/>
          <stop offset="0.92" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <mask id="band-mask">
          <rect x="0" y="0" width="640" height="180" fill="url(#mask-h)"/>
        </mask>
      </defs>

      <!-- horizontal grid -->
      <g stroke="#F1F4F8" stroke-width="1">
        <line x1="60" y1="20"  x2="620" y2="20"/>
        <line x1="60" y1="60"  x2="620" y2="60"/>
        <line x1="60" y1="100" x2="620" y2="100"/>
        <line x1="60" y1="140" x2="620" y2="140"/>
      </g>

      <!-- reference band — gradient fill only, no stroke; soft feather at horizontal edges -->
      <path d="M40,55 L640,50 L640,118 L40,115 Z" fill="url(#g)" mask="url(#band-mask)"/>

      <!-- line -->
      <path d="M75,128 C 160,120 220,80 305,90 S 470,40 545,150"
            fill="none" stroke="#4484B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- points -->
      <circle cx="75"  cy="128" r="4" fill="#4484B2" stroke="#fff" stroke-width="1.5"/>
      <circle cx="195" cy="92"  r="4" fill="#4484B2" stroke="#fff" stroke-width="1.5"/>
      <circle cx="305" cy="90"  r="4" fill="#4484B2" stroke="#fff" stroke-width="1.5"/>
      <circle cx="430" cy="42"  r="4.5" fill="#E5363F" stroke="#fff" stroke-width="1.5"/>
      <circle cx="545" cy="150" r="4.5" fill="#E5363F" stroke="#fff" stroke-width="1.5"/>

      <!-- y labels -->
      <g font-family="Inter" font-size="9" fill="#95AAC9" text-anchor="end">
        <text x="55" y="23">12.0</text>
        <text x="55" y="63">9.0</text>
        <text x="55" y="103">6.0</text>
        <text x="55" y="143">3.0</text>
      </g>

      <!-- x labels rotated -->
      <g font-family="Inter" font-size="9" fill="#95AAC9" text-anchor="middle">
        <text x="75"  y="170" transform="rotate(-45 75 170)">06/22</text>
        <text x="195" y="170" transform="rotate(-45 195 170)">11/22</text>
        <text x="305" y="170" transform="rotate(-45 305 170)">04/23</text>
        <text x="430" y="170" transform="rotate(-45 430 170)">10/23</text>
        <text x="545" y="170" transform="rotate(-45 545 170)">03/24</text>
      </g>
    </svg>

    <div style="font-size:11px; color:#95AAC9; text-align:center; margin-top:2px;">Plage actuelle&nbsp;: 0.0&nbsp;–&nbsp;5.0&nbsp;mg/L</div>
  </div>
</div></body></html>
