<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Numerics</title></head>
<body><div class="card">
  <div class="hemea-caption" style="margin-bottom:14px;">Tabular nums — utilisé pour toutes les valeurs labo</div>
  <div class="row" style="gap:24px; align-items:flex-end;">
    <div class="col" style="gap:4px;">
      <div class="hemea-label">CRP</div>
      <div style="font-size:32px;font-weight:700;color:#2C7BE5;font-variant-numeric:tabular-nums;line-height:1;">3.42</div>
      <div class="hemea-caption">mg/L · 12/03/24</div>
    </div>
    <div class="col" style="gap:4px;">
      <div class="hemea-label">Hémoglobine</div>
      <div style="font-size:32px;font-weight:700;color:#2C7BE5;font-variant-numeric:tabular-nums;line-height:1;">14.2</div>
      <div class="hemea-caption">g/dL · normale</div>
    </div>
    <div class="col" style="gap:4px;">
      <div class="hemea-label">Cholestérol total</div>
      <div style="font-size:32px;font-weight:700;color:#E5363F;font-variant-numeric:tabular-nums;line-height:1;">2.41</div>
      <div class="hemea-caption" style="color:#E5363F;">g/L · hors plage</div>
    </div>
    <div class="col" style="gap:4px;">
      <div class="hemea-label">TSH</div>
      <div style="font-size:32px;font-weight:400;color:#ADB5BD;font-variant-numeric:tabular-nums;line-height:1;">-.--</div>
      <div class="hemea-caption">mUI/L · non saisi</div>
    </div>
  </div>
</div></body></html>
