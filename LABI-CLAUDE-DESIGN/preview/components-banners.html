<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Banners</title></head>
<body><div class="card">
  <div class="col" style="gap:12px;">
    <div style="background:rgba(0,217,126,.10); border:1px solid #00D97E; border-radius:8px; padding:14px; text-align:center;">
      <span style="color:#00A86B; font-size:14px;">Analyse extraite et sauvegardée avec succès</span>
    </div>
    <div style="background:#FFF3CD; border:1px solid #FFEEBA; border-radius:8px; padding:14px;">
      <span style="color:#856404; font-size:14px;">Pensez à renseigner votre âge et votre sexe — les plages de référence en dépendent.</span>
    </div>
    <div style="background:rgba(229,54,63,.10); border:1px solid #E5363F; border-radius:8px; padding:14px;">
      <div style="color:#E5363F; font-size:14px; margin-bottom:6px;">Clé API non configurée. Définissez-la dans Réglages.</div>
      <button style="background:#2C7BE5; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;">Aller aux Réglages</button>
    </div>
  </div>
</div></body></html>
