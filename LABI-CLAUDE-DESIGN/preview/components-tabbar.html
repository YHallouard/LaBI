<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Tab bar — Liquid Glass</title>
<style>
  .stage {
    position:relative;
    height:280px;
    border-radius:22px;
    overflow:hidden;
    background:
      radial-gradient(circle at 18% 22%, #FFD3DC 0%, transparent 45%),
      radial-gradient(circle at 82% 18%, #C9B7E8 0%, transparent 50%),
      radial-gradient(circle at 60% 78%, #B7D3F2 0%, transparent 55%),
      linear-gradient(135deg, #F4F0F8 0%, #EEF2FB 60%, #FFFFFF 100%);
  }
  .content { position:absolute; inset:18px 18px 110px; display:flex; flex-direction:column; gap:10px; }
  .content .row { background:rgba(255,255,255,.72); height:42px; border-radius:12px; box-shadow:0 1px 2px rgba(18,38,63,.04); }
  .content .row.tall { height:60px; }

  /* Settings FAB top-right */
  .fab-settings {
    position:absolute; top:18px; right:18px;
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.55);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow: 0 6px 20px rgba(18,38,63,.10), inset 0 1px 0 rgba(255,255,255,.8);
    display:flex; align-items:center; justify-content:center;
  }

  /* Bottom dock — compact pill on left, FAB on right */
  .dock {
    position:absolute; left:18px; right:18px; bottom:18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .tabs {
    display:inline-flex; align-items:center; gap:2px;
    padding:5px;
    background:rgba(255,255,255,0.55);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.65);
    border-radius:9999px;
    box-shadow: 0 12px 30px rgba(18,38,63,.10), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .tab {
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
    width:78px; padding:7px 0 6px; border-radius:9999px; gap:1px;
    font-size:11px; font-weight:600; color:#5A7184; cursor:pointer;
    transition: all 200ms; border:none; background:transparent; font-family:inherit;
  }
  .tab.active {
    background:#fff; color:#2C7BE5;
    box-shadow: 0 2px 6px rgba(18,38,63,.10), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .tab svg { display:block; }

  .fab-import {
    width:56px; height:56px; border-radius:50%;
    background: #2C7BE5;
    box-shadow: 0 6px 20px rgba(44,123,229,.45), inset 0 1px 0 rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    position:relative;
  }
  .fab-import::after {
    content:""; position:absolute; inset:-3px; border-radius:50%;
    border:1px solid rgba(255,255,255,.45); pointer-events:none;
  }
</style>
</head>
<body><div class="card">
  <div class="stage">
    <div class="content">
      <div class="row tall"></div>
      <div class="row"></div>
      <div class="row"></div>
      <div class="row"></div>
    </div>

    <!-- Top-right Settings FAB -->
    <div class="fab-settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12263F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </div>

    <!-- Bottom dock: compact tabs pill (left) + FAB Import (right) -->
    <div class="dock">
      <div class="tabs">
        <button class="tab active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2C7BE5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8v9a2 2 0 0 1-2 2h-4v-7h-6v7H5a2 2 0 0 1-2-2v-9z"/></svg>
          Accueil
        </button>
        <button class="tab">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A7184" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="3" width="4" height="17"/></svg>
          Graphiques
        </button>
      </div>
      <div class="fab-import" title="Importer un PDF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="hemea-caption" style="margin-top:12px;">
    Pilule glass compacte (icône + label vertical, ≈160px) ancrée à gauche · FAB primaire à droite · Réglages = FAB glass en haut à droite de l'Accueil.
  </div>
</div></body></html>
