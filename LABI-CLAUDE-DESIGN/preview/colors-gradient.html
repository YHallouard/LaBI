<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Brand gradient</title></head>
<body><div class="card">
  <div style="height:120px; border-radius:14px; background: linear-gradient(135deg, #E5363F 0%, #CE5283 50%, #C255DF 100%); position:relative;">
    <div style="position:absolute; left:14px; bottom:10px; color:#fff; font-weight:700; font-size:14px; letter-spacing:.02em;">RÉSERVÉ AU LOGO</div>
  </div>
  <div class="row" style="gap:8px; margin-top:14px;">
    <div class="row" style="gap:6px;"><span style="width:14px;height:14px;border-radius:50%;background:#E5363F;display:inline-block;"></span><span class="mono" style="font-size:12px;">#E5363F</span></div>
    <div class="row" style="gap:6px;"><span style="width:14px;height:14px;border-radius:50%;background:#CE5283;display:inline-block;"></span><span class="mono" style="font-size:12px;">#CE5283</span></div>
    <div class="row" style="gap:6px;"><span style="width:14px;height:14px;border-radius:50%;background:#C255DF;display:inline-block;"></span><span class="mono" style="font-size:12px;">#C255DF</span></div>
  </div>
  <div style="margin-top:10px; font-size:12px; color:var(--hemea-text-faint);">
    Ne jamais utiliser ce dégradé comme fond d'UI ou bouton — il identifie uniquement la goutte du logo.
  </div>
</div></body></html>
