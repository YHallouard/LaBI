<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Stat cards</title></head>
<body><div class="card card--bg">
  <div style="display:flex; gap:8px;">
    <div style="flex:1; background:#fff; border-radius:8px; padding:12px; text-align:center; box-shadow:0 1px 2px rgba(18,38,63,.05);">
      <div style="font-size:12px; color:#95AAC9; margin-bottom:4px;">Dernier</div>
      <div style="font-size:16px; font-weight:700; color:#2C7BE5; font-variant-numeric:tabular-nums;">3.4 mg/L</div>
      <div style="font-size:10px; color:#95AAC9; margin-top:2px;">12/03/24</div>
    </div>
    <div style="flex:1; background:#fff; border-radius:8px; padding:12px; text-align:center; box-shadow:0 1px 2px rgba(18,38,63,.05);">
      <div style="font-size:12px; color:#95AAC9; margin-bottom:4px;">Moyenne</div>
      <div style="font-size:16px; font-weight:700; color:#2C7BE5; font-variant-numeric:tabular-nums;">5.1 mg/L</div>
    </div>
    <div style="flex:1; background:rgba(229,54,63,.10); border-radius:8px; padding:12px; text-align:center;">
      <div style="font-size:12px; color:#95AAC9; margin-bottom:4px;">Max</div>
      <div style="font-size:16px; font-weight:700; color:#E5363F; font-variant-numeric:tabular-nums;">12.8 mg/L</div>
      <div style="font-size:10px; color:#95AAC9; margin-top:2px;">08/01/24</div>
    </div>
  </div>
  <div class="hemea-caption" style="margin-top:14px;">Le 3ᵉ stat passe en rouge dès qu'une valeur sort de la plage de référence.</div>
</div></body></html>
