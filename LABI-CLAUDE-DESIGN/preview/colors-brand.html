<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Brand colors</title></head>
<body><div class="card">
  <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
    <div class="swatch">
      <div class="fill" style="background:#2C7BE5;"></div>
      <div class="meta">
        <span class="name">Primaire / Bleu Héméa</span>
        <span class="hex">#2C7BE5 · oklch(0.62 0.18 252)</span>
      </div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#00B4A6;"></div>
      <div class="meta">
        <span class="name">Secondaire / Teal</span>
        <span class="hex">#00B4A6</span>
      </div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#212529;"></div>
      <div class="meta">
        <span class="name">Texte principal</span>
        <span class="hex">#212529</span>
      </div>
    </div>
  </div>
</div></body></html>
