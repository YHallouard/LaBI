<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Buttons — sizes</title>
<style>
  .btn { font-family:var(--hemea-font-sans); font-weight:600; background:#2C7BE5; color:#fff; border:none; border-radius:8px; cursor:pointer; }
  .btn--sm { padding:6px 12px; font-size:13px; border-radius:6px; }
  .btn--md { padding:10px 18px; font-size:14px; }
  .btn--lg { padding:14px 24px; font-size:16px; }
  .btn--xl { padding:18px 32px; font-size:17px; min-width:240px; border-radius:10px; }
</style></head>
<body><div class="card">
  <div class="row" style="gap:14px; align-items:center; flex-wrap:wrap;">
    <button class="btn btn--sm">Bouton S</button>
    <button class="btn btn--md">Bouton M</button>
    <button class="btn btn--lg">Bouton L</button>
    <button class="btn btn--xl">Sélectionner &amp; analyser PDF</button>
  </div>
  <div class="hemea-caption" style="margin-top:14px;">XL est utilisé pour l'action principale d'un écran (Upload).</div>
</div></body></html>
