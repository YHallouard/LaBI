<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Glass surface (iOS)</title>
<style>
  .frame {
    position:relative;
    height:200px;
    border-radius:14px;
    overflow:hidden;
    /* faux fond médical pour montrer le flou */
    background:
      radial-gradient(circle at 20% 30%, #FFD3DC 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, #C9B7E8 0%, transparent 55%),
      radial-gradient(circle at 60% 80%, #B7D3F2 0%, transparent 55%),
      linear-gradient(135deg, #F4F0F8, #EEF2FB);
  }
  .glass {
    position:absolute; left:24px; right:24px; bottom:24px;
    padding:14px 16px;
    background: rgba(255,255,255,0.62);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.55);
    border-radius:18px;
    box-shadow: 0 10px 30px rgba(18,38,63,0.08), inset 0 1px 0 rgba(255,255,255,.7);
    display:flex; align-items:center; justify-content:space-between;
  }
</style></head>
<body><div class="card">
  <div class="frame">
    <div class="glass">
      <div>
        <div style="font-size:12px; color:#5A7184;">Plage actuelle</div>
        <div style="font-size:16px; font-weight:600; color:#12263F;">0.0 – 5.0 mg/L</div>
      </div>
      <button style="background:#2C7BE5;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;">Voir</button>
    </div>
  </div>
  <div class="hemea-caption" style="margin-top:10px;">GlassSurface · GlassCard · GlassButton — blur 28px, saturate 180%, bord blanc translucide. Fallback <code>expo-blur</code> sur anciennes versions iOS.</div>
</div></body></html>
