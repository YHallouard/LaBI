<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Processing steps</title>
<style>
  .step { display:flex; align-items:center; gap:12px; padding:10px 14px; position:relative; }
  .step + .step::before {
    content: ""; position:absolute; left:25px; top:-10px; width:2px; height:20px; background:#E3EBF6;
  }
  .step.done + .step::before, .step.done::before { background:#6DD39A; }
  .dot { width:22px; height:22px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
  .dot.done { background:#6DD39A; box-shadow:0 0 0 4px rgba(109,211,154,.18); }
  .dot.cur  { background:#fff; border:2.5px solid #2C7BE5; box-shadow:0 0 0 4px rgba(44,123,229,.14); position:relative; }
  .dot.cur::after { content:""; position:absolute; inset:2px; border-radius:50%; border:2px solid transparent; border-top-color:#2C7BE5; animation:spin 800ms linear infinite; }
  .dot.idle { background:#fff; border:1.5px solid #D6DEEA; }
  .label { font-size:14px; }
  .label .meta { display:block; font-size:11px; color:#95AAC9; margin-top:1px; }
  .label.done { color:#00A86B; font-weight:500; }
  .label.cur  { color:#2C7BE5; font-weight:700; }
  .label.idle { color:#95AAC9; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pill {
    background:rgba(44,123,229,.10); color:#2C7BE5; padding:3px 10px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  }
</style>
</head>
<body><div class="card card--bg">
  <div style="background:#fff; border-radius:16px; padding:14px 8px 12px; box-shadow:0 2px 6px rgba(18,38,63,.06);">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:0 14px 10px; border-bottom:1px solid #F1F4F8; margin-bottom:6px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C7BE5" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div>
          <div style="font-size:14px; font-weight:700; color:#12263F;">bilan_03_2024.pdf</div>
          <div style="font-size:11px; color:#95AAC9;">142 ko · 2 pages</div>
        </div>
      </div>
      <span class="pill">2 / 5</span>
    </div>

    <div class="step done">
      <div class="dot done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg></div>
      <div class="label done">Importation du document <span class="meta">142 ko · 320 ms</span></div>
    </div>
    <div class="step done">
      <div class="dot done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 7"/></svg></div>
      <div class="label done">Extraction de la date <span class="meta">12 mars 2024</span></div>
    </div>
    <div class="step">
      <div class="dot cur"></div>
      <div class="label cur">Analyse · Hématologie <span class="meta" style="color:#2C7BE5; opacity:.7;">OCR Mistral en cours…</span></div>
    </div>
    <div class="step">
      <div class="dot idle"></div>
      <div class="label idle">Analyse · Biochimie</div>
    </div>
    <div class="step">
      <div class="dot idle"></div>
      <div class="label idle">Sauvegarde de l'analyse</div>
    </div>
  </div>
</div></body></html>
