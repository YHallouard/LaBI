<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>FAB + segmented</title></head>
<body><div class="card card--bg">
  <div style="display:flex; align-items:center; gap:28px;">
    <!-- FAB cluster -->
    <div style="position:relative; width:120px; height:170px;">
      <div style="position:absolute; bottom:0; right:0; width:56px; height:56px; border-radius:9999px; background:#2C7BE5; box-shadow:0 4px 14px rgba(44,123,229,.40); display:flex; align-items:center; justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div style="position:absolute; bottom:64px; right:3px; width:50px; height:50px; border-radius:16px; background:#2C7BE5; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.2);"><span style="color:#fff; font-size:12px; font-weight:700;">3y</span></div>
      <div style="position:absolute; bottom:120px; right:3px; width:50px; height:50px; border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.2);"><span style="color:#2C7BE5; font-size:12px; font-weight:700;">1y</span></div>
    </div>
    <!-- Inline segmented -->
    <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
      <div class="hemea-caption">Plage de temps · FAB + sous-boutons animés (stagger spring)</div>
      <div style="display:inline-flex; background:#EEF2FB; border-radius:9999px; padding:4px; align-self:flex-start;">
        <span style="padding:6px 14px; font-size:13px; font-weight:600; color:#fff; background:#2C7BE5; border-radius:9999px;">3 ans</span>
        <span style="padding:6px 14px; font-size:13px; font-weight:600; color:#2C7BE5;">5 ans</span>
        <span style="padding:6px 14px; font-size:13px; font-weight:600; color:#2C7BE5;">Max</span>
      </div>
    </div>
  </div>
</div></body></html>
