<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Form inputs — mobile</title>
<style>
  .phone {
    width: 320px;
    background: #F8F9FA;
    border-radius: 28px;
    padding: 20px 18px;
    box-shadow: 0 1px 0 #E3EBF6 inset, 0 12px 30px rgba(18,38,63,.06);
    display:flex; flex-direction:column; gap:18px;
    font-family: -apple-system, "SF Pro Text", var(--hemea-font-sans);
  }
  .field-label {
    font-size:12px; font-weight:600; color:#5A7184;
    letter-spacing:.04em; margin-bottom:6px;
  }
  .input {
    width:100%; box-sizing:border-box;
    background:#fff; border:1px solid #E3EBF6; border-radius:12px;
    padding:14px; font-size:15px; color:#212529;
    font-family:inherit; outline:none;
  }
  .input.focus { border:1.5px solid #2C7BE5; box-shadow:0 0 0 4px rgba(44,123,229,.10); }
  .input.code  { font-family: ui-monospace, "SF Mono", monospace; font-size:13.5px; letter-spacing:.02em; }
  .picker {
    background:#fff; border:1px solid #E3EBF6; border-radius:12px;
    padding:6px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  .wheel { position:relative; height:84px; flex:1; overflow:hidden; }
  .wheel-cols { position:absolute; inset:0; display:grid; grid-template-columns: 1fr 1.4fr 1fr; }
  .col-wheel { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .col-wheel span { line-height: 1.4; }
  .col-wheel .dim { font-size:13px; color:#D6DEEA; }
  .col-wheel .sel { font-size:18px; color:#212529; font-weight:600; }
  .band {
    position:absolute; left:8px; right:8px; top:50%; transform:translateY(-50%);
    height:30px; background:rgba(44,123,229,.07);
    border-top:1px solid #E3EBF6; border-bottom:1px solid #E3EBF6;
    border-radius:6px; pointer-events:none;
  }
  .seg {
    display:flex; background:#EEF2FB; border-radius:9999px; padding:3px; height:46px;
  }
  .seg button {
    flex:1; border:none; background:transparent; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:600; color:#5A7184;
    border-radius:9999px; height:100%;
  }
  .seg button.on {
    background:#2C7BE5; color:#fff;
    box-shadow: 0 1px 3px rgba(44,123,229,.30);
  }
</style>
</head>
<body><div class="card card--bg">
  <div style="display:flex; gap:24px; align-items:flex-start;">

    <div class="phone">
      <!-- API key -->
      <div>
        <div class="field-label">Clé API Mistral</div>
        <div style="position:relative;">
          <input class="input focus code" value="mk-•••• •••• •••• 8f2a">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#95AAC9" stroke-width="2" style="position:absolute; right:14px; top:50%; transform:translateY(-50%);"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>

      <!-- Date of birth — full-width iOS wheel picker -->
      <div>
        <div class="field-label">Date de naissance</div>
        <div class="picker">
          <div class="wheel">
            <div class="wheel-cols">
              <div class="col-wheel">
                <span class="dim">11</span>
                <span class="sel">12</span>
                <span class="dim">13</span>
              </div>
              <div class="col-wheel">
                <span class="dim">février</span>
                <span class="sel">mars</span>
                <span class="dim">avril</span>
              </div>
              <div class="col-wheel">
                <span class="dim">1991</span>
                <span class="sel">1992</span>
                <span class="dim">1993</span>
              </div>
            </div>
            <div class="band"></div>
          </div>
        </div>
      </div>

      <!-- Sex segmented — full-width, taps -->
      <div>
        <div class="field-label">Sexe</div>
        <div class="seg">
          <button class="on">Femme</button>
          <button>Homme</button>
        </div>
      </div>
    </div>

    <div class="col" style="gap:8px; padding-top:30px;">
      <div class="hemea-caption">Layout mobile</div>
      <div style="font-size:13px; color:#5A7184; max-width:240px; line-height:1.5;">
        Champs empilés pleine largeur, roues iOS pour la date, segmented à 2 options en pleine largeur.
      </div>
      <div class="hemea-caption" style="margin-top:8px;">Touches</div>
      <div style="font-size:13px; color:#5A7184; max-width:240px; line-height:1.5;">
        Hauteur ≥ 46px, espacement vertical 18px&nbsp;— confortable au pouce.
      </div>
    </div>

  </div>
</div></body></html>
