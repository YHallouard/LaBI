<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Semantic colors</title></head>
<body><div class="card">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="swatch">
      <div class="fill" style="background:#6DD39A;"></div>
      <div class="meta"><span class="name">Succès</span><span class="hex">#6DD39A</span></div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#FFC107;"></div>
      <div class="meta"><span class="name">Avertissement</span><span class="hex">#FFC107</span></div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#E5363F;"></div>
      <div class="meta"><span class="name">Erreur / Alerte</span><span class="hex">#E5363F</span></div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#CE5283;"></div>
      <div class="meta"><span class="name">Alerte labo</span><span class="hex">#CE5283</span></div>
    </div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:var(--hemea-text-faint); font-family:var(--hemea-font-sans);">
    Alerte labo (rose) marque un résultat hors plage de référence dans les graphiques.
  </div>
</div></body></html>
