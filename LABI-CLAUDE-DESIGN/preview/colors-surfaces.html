<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<title>Surfaces</title></head>
<body><div class="card">
  <div class="grid" style="grid-template-columns: repeat(4, 1fr); gap:14px;">
    <div class="swatch" style="border-color:#E3EBF6;">
      <div class="fill" style="background:#FFFFFF; border-bottom:1px solid #E3EBF6;"></div>
      <div class="meta"><span class="name">Surface élevée</span><span class="hex">#FFFFFF · cards</span></div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#F8F9FA;"></div>
      <div class="meta"><span class="name">Écran de base</span><span class="hex">#F8F9FA</span></div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#EEF2FB;"></div>
      <div class="meta"><span class="name">Tinté bleu</span><span class="hex">#EEF2FB</span></div>
    </div>
    <div class="swatch">
      <div class="fill" style="background:#F4F0F8;"></div>
      <div class="meta"><span class="name">Tinté violet</span><span class="hex">#F4F0F8</span></div>
    </div>
  </div>
  <div style="margin-top:14px; font-size:12px; color:var(--hemea-text-faint);">Fonds très clairs, atmosphère aérée et médicalement neutre.</div>
</div></body></html>
